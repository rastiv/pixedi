name: CI/CD Pipeline
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run TypeScript Type Check
        run: pnpm type-check

      - name: Run Vitest Tests
        run: pnpm test

      - name: Build widget and library
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # npm Trusted Publishing (OIDC, no token or secret). Configured on npmjs.com:
    # package pixedi → Settings → Trusted Publisher → GitHub Actions, rastiv/pixedi, deploy.yml.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Node 24 ships npm 11, which is required for Trusted Publishing
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish React Component to NPM
        run: |
          cp README.npm.md README.md
          VERSION=$(node -p "require('./package.json').version")
          if npm view pixedi@$VERSION version > /dev/null 2>&1; then
            echo "pixedi@$VERSION already published, skipping"
          else
            npm publish --access public
          fi
